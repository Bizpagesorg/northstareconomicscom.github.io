<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title"><title id="title">Hybrid trade forecast and savings</title><rect x="0" y="0" width="1200" height="675" rx="0" fill="#e1d9ed"/><circle cx="1050" cy="100" r="72" fill="#e8bd72"/><path d="M80 600L1120 600" stroke="#352b49" stroke-width="3" fill="none"/><text x="600" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" fill="#352b49">Hybrid trade: separate claims</text><rect x="70" y="205" width="330" height="315" rx="14" fill="#b8a0d2"/><text x="235" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#352b49">Export base</text><text x="235" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" fill="#352b49">€4bn</text><text x="235" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#352b49">hybrid exports</text><text x="235" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#352b49">Existing annual value</text><rect x="435" y="205" width="330" height="315" rx="14" fill="#e8bd72"/><text x="600" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#352b49">Duty saving</text><text x="600" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" fill="#352b49">≥€225m</text><text x="600" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#352b49">projected annually</text><text x="600" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#352b49">Commission estimate</text><rect x="800" y="205" width="330" height="315" rx="14" fill="#b8a0d2"/><text x="965" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#352b49">Four-year decline</text><text x="965" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" fill="#352b49">&gt;50%</text><text x="965" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#352b49">without action</text><text x="965" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#352b49">Forecast, not actual</text></svg>
