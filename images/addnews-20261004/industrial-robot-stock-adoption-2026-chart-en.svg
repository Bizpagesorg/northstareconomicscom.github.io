<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title"><title id="title">Industrial robot stock in 2025</title><rect x="0" y="0" width="1200" height="675" rx="0" fill="#d1e7e4"/><circle cx="1050" cy="100" r="56" fill="#e6b574"/><path d="M80 600L1120 600" stroke="#183e48" stroke-width="3" fill="none"/><text x="600" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" fill="#183e48">Industrial robot stock in 2025</text><rect x="80" y="180" width="480" height="355" rx="22" fill="#70b7b0"/><text x="320" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="66" fill="#183e48">5</text><text x="320" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#183e48">million operating robots</text><text x="320" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#183e48">Worldwide, 2025 stock</text><rect x="650" y="180" width="470" height="170" rx="18" fill="#e6b574"/><text x="885" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#183e48">Stock increase</text><text x="885" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" fill="#183e48">9%</text><text x="885" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#183e48">Compared with 2024</text><rect x="650" y="365" width="470" height="170" rx="18" fill="#d1e7e4"/><text x="885" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#183e48">Annual installations</text><text x="885" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" fill="#183e48">&gt;600,000</text><text x="885" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#183e48">New units during 2025</text></svg>
